[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev"
version = "0.2.0"
description = "Clean-room, open-source typed probabilistic decision layer for software and agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Xiao Zhu AI / Community"}]
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1"
]
keywords = ["ai", "agents", "decision-model", "structured-output", "calibration"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
laya = ["laya>=0.3.5,<0.4"]
laya-mlx = ["laya-mlx; python_version >= '3.11'"]

[project.scripts]
openjev = "openjev.cli:main"
openjev-bench = "openjev.benchmark_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
